version: '3.9'

# Development override — hot reload dengan volume mount source code
services:
  postgres:
    image: postgres:16-alpine
    container_name: dezpay-postgres-dev
    environment:
      POSTGRES_DB: dezpay_dev
      POSTGRES_USER: dezpay_user
      POSTGRES_PASSWORD: dezpay_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dezpay_user -d dezpay_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dezpay-redis-dev
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dezpay-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://dezpay_user:dezpay_password@postgres:5432/dezpay_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production-32chars
      JWT_EXPIRES_IN: 24h
      BCRYPT_ROUNDS: 10
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    ports:
      - "3000:3000"

volumes:
  postgres_dev_data:
